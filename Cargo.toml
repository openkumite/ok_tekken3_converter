[package]
name = "ok_tekken3_converter"
version = "0.1.0"
edition = "2024"
description = "Converts your own Tekken 3 disc image (PlayStation, USA, SLUS-00402) into the game data OpenKumite plays"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
# the developer tool: the conversion's steps one at a time (docs/converter.md)
name = "t3_convert"
path = "src/main.rs"

[dependencies]
ok_converter_common = { git = "https://github.com/openkumite/ok_converter_common", branch = "main" }
anyhow = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }
# pinned: an update could change the output bits (the fingerprint)
libm = "=0.2.16"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
cargo-husky = { version = "1.5.0", default-features = false, features = ["user-hooks"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
debug = 1

[profile.dev]
opt-level = 2
